# M9a (K-98): la web nueva del Hackathon OS. Quien usa el kit no instala Node: el compilado va subido en
# hkos/web/nueva/. Aquí se comprueba que sale del fuente: tests de Vitest, vistas de ejemplo al día con proyeccion.py,
# compilado sin URL externas e igual al subido (criterios 2, 3 y 4 de M9a, ADR-0009).
name: Web de trabajo (M9a)
on:
  push:
    paths:
      - "hkos/**"
      - "evals/coordinacion/simulador/**"
      - "docs/hackathon-os/contratos/**"
      - "docs/hackathon-os/diseno-web/sistema/tokens.json"
      - ".github/workflows/web-m9a.yml"
  pull_request:
    paths:
      - "hkos/**"
      - "evals/coordinacion/simulador/**"
      - "docs/hackathon-os/contratos/**"
      - "docs/hackathon-os/diseno-web/sistema/tokens.json"
      - ".github/workflows/web-m9a.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # En Ubuntu y en Windows (Git Bash, con core.autocrlf como en un Windows de verdad): el compilado y las vistas de
  # ejemplo tienen que salir idénticos a los subidos en los dos.
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8     # la consola del runner de Windows es cp1252
    defaults:
      run:
        shell: bash               # en Windows, Git Bash
        working-directory: hkos/web-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hkos/web-src/package-lock.json
      - name: uv (para las vistas de ejemplo), versión fija
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: false
      - name: Dependencias (versiones exactas del lock)
        run: npm ci
      - name: Vistas de ejemplo al día (G1–G6, G12, 5×20 desde el relay de verdad; M10, api.md §11.6, G13 y G14; M11, G15)
        run: |
          uv run --no-project scripts/vistas_ejemplo.py
          git diff --exit-code -- test/vistas
          test -z "$(git status --porcelain -- test/vistas)"
      - name: Tests (Vitest y jsdom)
        run: npm test
      - name: Compilado
        run: npm run build
      - name: Sin URL externas y con lo que sirve el demonio
        run: node scripts/comprueba_compilado.mjs
      # Issue #15 (hallazgo 3) y PR #17: 9 pestañas de Chrome headless contra un demonio de verdad, con el compilado
      # recién hecho: todas pintan y hay un solo /v1/stream. ubuntu-latest trae Chrome; si no estuviera, se instala.
      - name: ¿Chrome en el runner?
        id: chrome
        if: runner.os == 'Linux'
        run: |
          ruta="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          echo "ruta=$ruta" >> "$GITHUB_OUTPUT"
          echo "Chrome: ${ruta:-no está}"
      - name: Chrome (si falta), versión fija
        id: chrome_nuevo
        if: runner.os == 'Linux' && steps.chrome.outputs.ruta == ''
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4   # v2.2.0
        with:
          install-dependencies: true
      - name: 9 pestañas, un solo /v1/stream (pestanas_chrome.mjs)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          CHROME: ${{ steps.chrome_nuevo.outputs.chrome-path || steps.chrome.outputs.ruta }}
        run: |
          "$CHROME" --version
          node scripts/pestanas_chrome.mjs --pestanas 9
      - name: El compilado subido coincide con el fuente
        run: |
          git status --porcelain -- ../web/nueva
          git diff --exit-code -- ../web/nueva
          test -z "$(git status --porcelain -- ../web/nueva)"
